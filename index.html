* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; margin: 0;
}
#root { max-width: 1060px; margin: 0 auto; padding: 28px 20px 76px; }

/* ---------- header ---------- */
.head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.eyebrow {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase;
  color: var(--text-faint); margin: 0 0 6px;
}
h1 {
  font-family: Fraunces, Georgia, "Times New Roman", serif;
  font-weight: 600; font-size: clamp(28px, 5vw, 40px); line-height: 1.08;
  letter-spacing: -.015em; text-wrap: balance; margin: 0;
}
.sub { color: var(--text-muted); font-size: 14px; margin: 7px 0 0; }
.badge {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 6px 13px 6px 11px;
  font-size: 12.5px; font-weight: 500; color: var(--text-muted); white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.badge.ro .dot { background: var(--text-faint); }
.head-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- fotos ---------- */
.fotos { display: flex; gap: 9px; overflow-x: auto; margin: 0 0 24px; padding-bottom: 2px; scrollbar-width: thin; }
.fotos figure { margin: 0; flex: 1 1 0; min-width: 168px; }
.foto-btn {
  display: block; width: 100%; padding: 0; border: 0; background: none;
  cursor: zoom-in; border-radius: 11px; position: relative; line-height: 0;
}
.foto-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.fotos img {
  display: block; width: 100%; aspect-ratio: 3 / 2; min-height: 118px; height: auto;
  object-fit: cover; object-position: center;
  border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2);
  transition: filter .18s ease;
}
.foto-btn:hover img { filter: brightness(.9); }
.foto-btn .lupa {
  position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%;
  background: rgba(18,20,22,.62); color: #fff; font-size: 14px; line-height: 26px; text-align: center;
  opacity: 0; transition: opacity .18s ease; pointer-events: none;
}
.foto-btn:hover .lupa, .foto-btn:focus-visible .lupa { opacity: 1; }
.fotos figcaption { font-size: 11px; color: var(--text-faint); margin-top: 5px; font-family: "IBM Plex Mono", monospace; line-height: 1.4; }

/* ---------- foto em tela cheia ---------- */
#lightbox { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; }
#lightbox.on { display: flex; }
#lightbox .veil2 { position: absolute; inset: 0; background: rgba(10,11,12,.95); cursor: zoom-out; }
#lightbox img {
  position: relative; max-width: 92vw; max-height: 84vh; object-fit: contain;
  border-radius: 10px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); background: #111;
}
.lb-btn {
  position: absolute; z-index: 2; cursor: pointer; border: 0; border-radius: 50%;
  background: rgba(255,255,255,.13); color: #fff; backdrop-filter: blur(4px);
  width: 44px; height: 44px; font: 400 24px/1 "IBM Plex Sans", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.lb-btn:hover { background: rgba(255,255,255,.26); }
.lb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.lb-close { top: 18px; right: 18px; }
.lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
.lb-conta {
  position: absolute; z-index: 2; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,.75); font: 500 12.5px/1 "IBM Plex Mono", monospace;
  background: rgba(255,255,255,.1); padding: 7px 13px; border-radius: 999px; backdrop-filter: blur(4px);
}
@media (max-width: 560px) {
  .lb-prev { left: 8px; } .lb-next { right: 8px; }
  .lb-btn { width: 38px; height: 38px; font-size: 20px; }
  #lightbox img { max-width: 96vw; max-height: 76vh; }
}

/* ---------- hero ---------- */
.hero {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 24px; margin-bottom: 30px;
  display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 30px; align-items: center;
}
.total-block { border-right: 1px solid var(--border); padding-right: 30px; }
.total-k, .hb-k { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 8px; }
.hero-num {
  font-family: "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums;
  font-size: clamp(36px, 5.4vw, 46px); font-weight: 600; letter-spacing: -.025em; line-height: 1; margin: 0;
}
.hero-of { color: var(--text-muted); font-size: 13.5px; margin: 9px 0 0; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; line-height: 1.6; }
.hero-of b { color: var(--text); font-weight: 600; }
.hbs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
.hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hb-k { margin: 0; }
.hb-pct { font: 600 15px/1 "IBM Plex Sans", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.hb.full .hb-pct { color: var(--ok); }
.hb-bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 8px 0 7px; }
.hb-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.hb.full .hb-bar > i { background: var(--ok); }
.hb-bar.big { height: 10px; margin: 16px 0 0; }
.hb-bar.big > i { background: var(--ok); }
.hb-segs { display: flex; gap: 3px; margin: 8px 0 7px; }
.hb-segs .seg { position: relative; height: 8px; border-radius: 3px; background: var(--track); overflow: hidden; min-width: 18px; flex-basis: 0; }
.hb-segs .seg:first-child { border-radius: 999px 3px 3px 999px; }
.hb-segs .seg:last-child { border-radius: 3px 999px 999px 3px; }
.hb-segs .seg > i { display: block; height: 100%; background: var(--accent); }
.hb-segs .seg.full > i { background: var(--ok); }
.hb-segs .seg > b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hb-v { margin: 0; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-muted); }
.hb-v b { color: var(--text); font-weight: 600; }
.hb-n { color: var(--text-faint); }

/* ---------- resumo por pessoa ---------- */
.sums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
.sum { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border-strong); border-radius: 14px; padding: 14px 16px 12px; box-shadow: var(--shadow); }
.sum.s-done { border-top-color: var(--ok); }
.sum.s-late { border-top-color: var(--late); }
.sum.s-open { border-top-color: var(--accent); }
.sum-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 9px; }
.sum-falta { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.sum-falta b { color: var(--text); font-size: 16px; font-weight: 600; }
.sum-falta.ok { color: var(--ok); font-weight: 600; }
.sum-rows { list-style: none; margin: 0; padding: 0; }
.sum-rows li { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--border); font-size: 13px; }
.sum-rows .k { color: var(--text-muted); }
.sum-rows .v { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-muted); text-align: right; white-space: nowrap; }
.sum-rows li.r-done .v { color: var(--ok); font-weight: 600; }
.sum-rows li.r-late .v, .sum-rows li.r-late .k { color: var(--late); }
.dots { display: flex; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.dots i.on { background: var(--ok); border-color: var(--ok); }
.dots i.late { border-color: var(--late); background: var(--late-soft); }
.rb { display: block; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.rb > i { display: block; height: 100%; background: var(--warn); border-radius: 999px; }
li.r-done .rb > i { background: var(--ok); }
li.r-late .rb > i { background: var(--late); }
.lg { display: inline-flex; align-items: center; gap: 5px; margin-left: 11px; white-space: nowrap; }
.lg i { width: 9px; height: 9px; border-radius: 50%; }
.lg i.done { background: var(--ok); } .lg i.part { background: var(--warn); }
.lg i.late { background: var(--late); } .lg i.open { border: 1.5px solid var(--border-strong); }

/* ---------- detalhes ---------- */
details.det { margin-bottom: 26px; }
details.det > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 17px;
  font-weight: 600; font-size: 14.5px;
}
details.det > summary::-webkit-details-marker { display: none; }
details.det > summary::before { content: "+"; font: 500 16px/1 "IBM Plex Mono", monospace; color: var(--accent); width: 12px; }
details.det[open] > summary::before { content: "\2212"; }
details.det > summary:hover { border-color: var(--accent); }
details.det > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.det-n { font-weight: 400; font-size: 12.5px; color: var(--text-faint); }
.det-body { padding-top: 22px; }

/* ---------- sections ---------- */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 19px; letter-spacing: -.01em; margin: 0; }
.sec-note { font-size: 12.5px; color: var(--text-faint); text-align: right; }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600; border: 1px solid transparent; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.part { background: var(--warn-soft); color: var(--warn); }
.pill.open { background: transparent; color: var(--text-faint); border-color: var(--border-strong); font-weight: 500; }
.pill.late { background: var(--late-soft); color: var(--late); }

/* ---------- parcelas strip ---------- */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-bottom: 32px; }
.pcard { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 12px; padding: 13px 14px; }
.pcard .pn { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 6px; }
.pcard .pd { font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 0; }
.pcard .pc { font-size: 12px; color: var(--text-muted); margin: 5px 0 9px; font-variant-numeric: tabular-nums; }
.pcard.s-done { border-left-color: var(--ok); }
.pcard.s-open { border-left-color: var(--border-strong); }
.pcard.s-late { border-left-color: var(--late); }

/* ---------- pessoas ---------- */
.people { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 34px; }
.person { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 17px 18px; box-shadow: var(--shadow); }
.person-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.person-name { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.person-val { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--text-muted); text-align: right; white-space: nowrap; }
.person-val b { color: var(--text); font-weight: 600; }
.mini { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 12px 0 13px; }
.mini > i { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .4s cubic-bezier(.4,0,.2,1); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 500;
  transition: transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--text); }
button.chip:active { transform: scale(.95); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip.paid { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.late { background: var(--late-soft); border-color: var(--late); color: var(--late); }
.chip .mk { font-size: 11px; }
.chip .cn { font-size: 10.5px; opacity: .7; }
.chips:has(.cn) { gap: 5px; }
.chips:has(.cn) .chip { padding: 6px 7px; gap: 4px; font-size: 11.5px; }

/* ---------- caucao ---------- */
.cau { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 34px; }
.cau-row {
  display: grid; grid-template-columns: 1fr 150px 148px 120px 100px;
  gap: 8px 14px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--border);
}
.cau-row:first-child { border-top: 0; }
.cau-name { font-weight: 500; }
.cau-tot { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
.cau-tot b { font-weight: 600; font-size: 15px; }
.cau-tot .of { color: var(--text-faint); }
.cau-add { display: flex; align-items: center; gap: 5px; }
.cau-add .cur { font-size: 12px; color: var(--text-faint); font-family: "IBM Plex Mono", monospace; }
.cau-add input {
  width: 100%; min-width: 0; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 9px;
  font: 500 13px/1.3 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right;
}
.cau-add input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.plus {
  flex: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
  background: var(--accent); border: 1px solid var(--accent); color: var(--surface);
  font: 600 17px/1 "IBM Plex Sans", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.plus:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.plus:active { transform: scale(.93); }
.plus:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cau-lancs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
.lanc {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 11.5px; padding: 3px 8px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 5px;
}
button.lanc { cursor: pointer; }
button.lanc:hover { border-color: var(--late); color: var(--late); background: var(--late-soft); }
button.lanc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lanc .x { opacity: .55; font-size: 13px; }
button.lanc:hover .x { opacity: 1; }
.cau-bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.cau-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.cau-bar.full > i { background: var(--ok); }
.cau-st { text-align: right; }
.cau-foot {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 18px; background: var(--surface-2); border-top: 1px solid var(--border);
  font-size: 13px; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; color: var(--text-muted);
}
.cau-foot b { color: var(--text); font-weight: 600; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- ajustes ---------- */
details.cfg { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 20px; }
details.cfg > summary { cursor: pointer; padding: 13px 17px; font-size: 13.5px; font-weight: 500; color: var(--text-muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details.cfg > summary::-webkit-details-marker { display: none; }
details.cfg > summary::before { content: "+"; font-family: "IBM Plex Mono", monospace; color: var(--text-faint); }
details.cfg[open] > summary::before { content: "\2212"; }
details.cfg > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
.cfg-body { padding: 4px 17px 18px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 18px; }
.cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 11px; }
.fld { display: flex; flex-direction: column; gap: 5px; }
.fld label { font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); }
.fld input {
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 7px 9px; font: 400 13.5px/1.3 "IBM Plex Sans", system-ui, sans-serif; width: 100%;
}
.fld input[type="number"], .fld input[type="date"] { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.vals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.vals input { padding-left: 4px; padding-right: 4px; text-align: center; min-width: 0; }
.cfg-pess { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.fld input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.cfg-h { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 9px; }
.cfg-sum { font-size: 12.5px; color: var(--text-muted); margin: 9px 0 0; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 7px 13px; font: 500 13px/1.3 "IBM Plex Sans", system-ui, sans-serif;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-key { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn-key:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
#modal.on { display: flex; }
#modal .veil { position: absolute; inset: 0; background: rgba(20,22,24,.55); }
.modal-box {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5);
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px;
}
.modal-box h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 21px; margin: 0 0 8px; letter-spacing: -.01em; }
.modal-box p { color: var(--text-muted); font-size: 14px; margin: 0 0 14px; }
.modal-box ol { color: var(--text-muted); font-size: 14px; margin: 0 0 16px; padding-left: 20px; }
.modal-box ol li + li { margin-top: 6px; }
.modal-box b { color: var(--text); font-weight: 600; }
.modal-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 14px; }
#m-code {
  width: 100%; height: 150px; resize: vertical;
  background: var(--surface-2); color: var(--text-muted);
  border: 1px solid var(--border-strong); border-radius: 9px; padding: 9px 11px;
  font: 400 11.5px/1.45 "IBM Plex Mono", ui-monospace, monospace; white-space: pre; overflow: auto;
}
#m-code:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.modal-hint { font-size: 12.5px; color: var(--text-faint); margin: 10px 0 0 !important; }
.modal-hint.alerta { color: var(--late); background: var(--late-soft); border-radius: 8px; padding: 9px 11px; }
.modal-hint b { color: inherit; }
.modal-close { position: absolute; top: 14px; right: 14px; background: transparent; border: 0; color: var(--text-faint); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.modal-close:hover { color: var(--text); background: var(--surface-2); }
.modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 11px; }
.thumb { position: relative; }
.thumb img { display: block; width: 96px; height: 66px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
.thumb button {
  position: absolute; top: -6px; right: -6px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--text); color: var(--surface); border: 0; cursor: pointer;
  font: 600 13px/1 "IBM Plex Sans", sans-serif; display: flex; align-items: center; justify-content: center;
}
.thumb button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- footer / toast ---------- */
.foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-faint); line-height: 1.65; }
.foot b { color: var(--text-muted); font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px);
  background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 16px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; box-shadow: 0 8px 30px -8px rgba(0,0,0,.45);
  z-index: 50; max-width: calc(100vw - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 22px; }
  .total-block { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
  .sums { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .people { grid-template-columns: 1fr; }
  .cau-row { grid-template-columns: 1fr 140px 148px; }
  .cau-bar { display: none; }
  .cau-st { grid-column: 2 / -1; text-align: left; }
}
@media (max-width: 620px) {
  .sums { grid-template-columns: 1fr; }
  .hbs { grid-template-columns: 1fr; gap: 16px; }
  .sec-head { flex-wrap: wrap; }
  .sec-note { text-align: left; }
  .lg { margin: 0 11px 0 0; }
  .fotos { scroll-snap-type: x mandatory; gap: 10px; margin-left: -14px; margin-right: -14px; padding: 0 14px 4px; scrollbar-width: none; }
  .fotos figure { flex: 0 0 82%; min-width: 0; scroll-snap-align: center; }
  .fotos img { aspect-ratio: 4 / 3; }
}
@media (max-width: 460px) {
  #root { padding: 20px 14px 60px; }
  .hero { padding: 20px 16px; }
  .cau-row { grid-template-columns: 1fr 148px; row-gap: 7px; }
  .cau-tot { grid-column: 1; }
  .cau-add { grid-column: 2; grid-row: 1 / 3; }
  .cau-st { grid-column: 1; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  var BRL2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function spansYears() {
    var ys = {};
    state.parcelas.forEach(function (p) { if (p.vencimento) ys[p.vencimento.slice(0, 4)] = 1; });
    return Object.keys(ys).length > 1;
  }
  function br(iso, withYear) {
    if (!iso) return "—";
    var p = String(iso).split("-");
    return p[2] + "/" + p[1] + (withYear ? "/" + p[0].slice(2) : "");
  }
  function brFull(iso) { if (!iso) return ""; var p = String(iso).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function money(v) { return Math.abs(v % 1) < 0.005 ? BRL0.format(v) : BRL2.format(v); }

  function nPess() { return state.pessoas.length; }
  function nParc() { return state.parcelas.length; }
  /* valor de cada pessoa em cada parcela; sem valor = parcela não se aplica a ela */
  function valorDe(pe, n) {
    if (!pe.valores) return +pe.parcela || 0;
    var v = pe.valores[n];
    return v == null || v === "" ? null : (+v || 0);
  }
  function aplica(pe, n) { return valorDe(pe, n) !== null; }
  function quemDeve(n) { return state.pessoas.filter(function (p) { return aplica(p, n); }); }
  function somaParcela(n) { return quemDeve(n).reduce(function (a, p) { return a + valorDe(p, n); }, 0); }
  function alvoParcelas() { return state.parcelas.reduce(function (a, p) { return a + somaParcela(p.n); }, 0); }
  function totalPessoa(pe) { return state.parcelas.reduce(function (a, p) { return a + (valorDe(pe, p.n) || 0); }, 0); }
  function porPessoaFundo(f) { return +state[FUNDOS[f].cfg].porPessoa || 0; }
  /* quem entra no fundo: a turma toda + quem só participa dele (extras, com valor próprio) */
  function pessoasFundo(f) { return state.pessoas.concat(state[FUNDOS[f].cfg].extras || []); }
  function alvoPessoa(f, pe) { return pe.alvo != null ? +pe.alvo || 0 : porPessoaFundo(f); }
  function entradaPessoa(f, pe) { return pe.entrada != null ? +pe.entrada || 0 : +state[FUNDOS[f].cfg].entrada || 0; }
  function alvoFundo(f) { return pessoasFundo(f).reduce(function (a, p) { return a + alvoPessoa(f, p); }, 0); }
  function isPago(pid, n) { return Object.prototype.hasOwnProperty.call(state.pagos, pid + ":" + n); }
  function lancsDe(f, pid) { return state[FUNDOS[f].lanc][pid] || []; }
  function pagoFundo(f, pid) {
    return lancsDe(f, pid).reduce(function (a, l) { return a + (+l.v || 0); }, 0);
  }
  function recebidoParcela(n) { return quemDeve(n).reduce(function (a, p) { return a + (isPago(p.id, n) ? valorDe(p, n) : 0); }, 0); }
  function recebidoParcelas() { return state.parcelas.reduce(function (a, p) { return a + recebidoParcela(p.n); }, 0); }
  function recebidoFundo(f) { return pessoasFundo(f).reduce(function (a, p) { return a + pagoFundo(f, p.id); }, 0); }
  function vencida(iso) { return !!iso && iso < today(); }

  function statusParcela(p) {
    var q = quemDeve(p.n), c = q.filter(function (x) { return isPago(x.id, p.n); }).length;
    if (c === q.length && q.length > 0) return "done";
    return vencida(p.vencimento) ? "late" : "open";
  }

  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
  function larg(a, b) { return b > 0 ? Math.min(100, Math.round((a / b) * 100)) : 0; }

  function heroHTML() {
    var aP = alvoParcelas(), rP = recebidoParcelas(), aG = aP, rG = rP;
    ORDEM_FUNDOS.forEach(function (f) { aG += alvoFundo(f); rG += recebidoFundo(f); });
    /* barra da casa em 5 pedaços, um por parcela, do tamanho de cada parcela */
    var segs = state.parcelas.map(function (p) {
      var a = somaParcela(p.n), r = recebidoParcela(p.n);
      return '<span class="seg' + (a > 0 && r >= a ? " full" : "") + '" style="flex-grow:' + a + '" title="Parcela ' + p.n + ": " + money(r) + " de " + money(a) + '">'
        + '<i style="width:' + larg(r, a) + '%"></i><b>P' + p.n + "</b></span>";
    }).join("");
    var barra = function (nome, r, a, nota, corpo) {
      return '<div class="hb' + (a > 0 && r >= a ? " full" : "") + '"><div class="hb-top"><span class="hb-k">' + nome + '</span><span class="hb-pct">' + pct(r, a) + "%</span></div>"
        + corpo
        + '<p class="hb-v"><b>' + money(r) + "</b> de " + money(a) + (nota ? ' <span class="hb-n">&middot; ' + nota + "</span>" : "") + "</p></div>";
    };
    return '<div class="total-block"><p class="total-k">Total geral em caixa</p>'
      + '<p class="hero-num">' + money(rG) + "</p>"
      + '<p class="hero-of">de <b>' + money(aG) + "</b> &middot; " + pct(rG, aG) + "%<br>faltam <b>" + money(aG - rG) + "</b></p>"
      + '<div class="hb-bar big"><i style="width:' + larg(rG, aG) + '%"></i></div></div>'
      + '<div class="hbs">'
      + barra("Parcelas da casa", rP, aP, "", '<div class="hb-segs">' + segs + "</div>")
      + ORDEM_FUNDOS.map(function (f) {
          var a = alvoFundo(f), r = recebidoFundo(f), v = state[FUNDOS[f].cfg].vencimento;
          return barra(FUNDOS[f].nome, r, a, v ? "vence " + br(v, true) : "entrada + restante",
            '<div class="hb-bar"><i style="width:' + larg(r, a) + '%"></i></div>');
        }).join("")
      + "</div>";
  }

  /* ---------- resumo: um cartão por pessoa com tudo o que ela deve ---------- */
  function contasDe(pe) {
    var rows = [];
    var naCasa = state.pessoas.indexOf(pe) >= 0;
    if (naCasa) {
      var minhas = state.parcelas.filter(function (p) { return aplica(pe, p.n); });
      var pago = 0, atras = false;
      var dots = minhas.map(function (p) {
        var ok = isPago(pe.id, p.n);
        if (ok) pago += valorDe(pe, p.n); else if (vencida(p.vencimento)) atras = true;
        return '<i class="' + (ok ? "on" : vencida(p.vencimento) ? "late" : "") + '" title="P' + p.n + " " + money(valorDe(pe, p.n)) + (ok ? " paga" : "") + '"></i>';
      }).join("");
      rows.push({ k: "Casa", pago: pago, alvo: totalPessoa(pe), late: atras, mid: '<span class="dots">' + dots + "</span>" });
    }
    ORDEM_FUNDOS.forEach(function (f) {
      var lista = pessoasFundo(f);
      if (lista.indexOf(pe) < 0) return;
      var a = alvoPessoa(f, pe), pg = pagoFundo(f, pe.id);
      rows.push({ k: FUNDOS[f].nome, pago: pg, alvo: a, late: pg < a && vencida(state[FUNDOS[f].cfg].vencimento),
        mid: '<span class="rb"><i style="width:' + larg(pg, a) + '%"></i></span>' });
    });
    return rows;
  }
  function stRow(r) { return r.alvo > 0 && r.pago >= r.alvo ? "done" : r.late ? "late" : r.pago > 0 ? "part" : "open"; }
  function cartaoHTML(pe) {
    var rows = contasDe(pe), falta = 0, late = false;
    rows.forEach(function (r) { falta += Math.max(0, r.alvo - r.pago); if (stRow(r) === "late") late = true; });
    var st = falta <= 0 ? "done" : late ? "late" : "open";
    return '<article class="sum s-' + st + '"><div class="sum-top"><span class="person-name">' + esc(pe.nome) + "</span>"
      + (falta <= 0 ? '<span class="sum-falta ok">Tudo pago &#10003;</span>'
                    : '<span class="sum-falta">falta <b>' + money(falta) + "</b></span>")
      + '</div><ul class="sum-rows">' + rows.map(function (r) {
          return '<li class="r-' + stRow(r) + '"><span class="k">' + r.k + "</span>" + r.mid
            + '<span class="v">' + (r.pago >= r.alvo && r.alvo > 0 ? "pago &#10003;" : money(r.pago) + " / " + money(r.alvo)) + "</span></li>";
        }).join("") + "</ul></article>";
  }
  function resumoHTML() {
    var todos = state.pessoas.slice();
    ORDEM_FUNDOS.forEach(function (f) { (state[FUNDOS[f].cfg].extras || []).forEach(function (x) { if (todos.indexOf(x) < 0) todos.push(x); }); });
    return todos.map(cartaoHTML).join("");
  }
  function nExtras() {
    var n = 0;
    ORDEM_FUNDOS.forEach(function (f) { n += (state[FUNDOS[f].cfg].extras || []).length; });
    return n;
  }

  function render() {
    var h = "";
    var dts = state.casa.checkin && state.casa.checkout
      ? " &middot; " + brFull(state.casa.checkin) + " a " + brFull(state.casa.checkout) : "";

    h += '<header class="head"><div>'
      + '<p class="eyebrow">Rateio da casa &middot; ' + nPess() + " amigos" + (nExtras() ? " + " + nExtras() + " na van" : "") + "</p>"
      + "<h1>" + esc(state.casa.nome) + "</h1>"
      + '<p class="sub">' + esc(state.casa.local) + dts + "</p></div>"
      + '<div class="head-actions">'
      + (canEdit ? '<button type="button" class="btn btn-key" id="exportar">Atualizar o grupo</button>' : "")
      + (canEdit ? '<span class="badge"><span class="dot"></span>Voc&ecirc; pode dar baixa</span>' : "") + "</div></header>";

    if (state.fotos.length) {
      h += '<div class="fotos">' + state.fotos.map(function (f, i) {
        return '<figure><button type="button" class="foto-btn" data-foto="' + i + '"'
          + ' aria-label="Ver a foto ' + (i + 1) + " em tamanho grande\">"
          + '<img src="' + esc(f.src) + '" alt="Foto ' + (i + 1) + ' da turma">'
          + '<span class="lupa" aria-hidden="true">&#9906;</span></button>'
          + (f.legenda ? "<figcaption>" + esc(f.legenda) + "</figcaption>" : "") + "</figure>";
      }).join("") + "</div>";
    }

    h += '<section class="hero" id="hero">' + heroHTML() + "</section>";

    h += '<div class="sec-head"><h2>Quanto falta pra cada um</h2><span class="sec-note">'
      + '<span class="lg"><i class="done"></i>pago</span><span class="lg"><i class="part"></i>parcial</span>'
      + '<span class="lg"><i class="late"></i>atrasado</span><span class="lg"><i class="open"></i>a pagar</span></span></div>';
    h += '<div class="sums" id="resumo">' + resumoHTML() + "</div>";

    h += '<details class="det"' + (canEdit ? " open" : "") + '><summary><span>Ver os detalhes de cada conta</span>'
      + '<span class="det-n">parcelas, cau&ccedil;&atilde;o, empregada e van</span></summary><div class="det-body">';

    /* por parcela */
    h += '<div class="sec-head"><h2>Por parcela</h2><span class="sec-note">' + money(alvoParcelas()) + " no total, somando os " + nPess() + "</span></div>";
    h += '<div class="strip">';
    var yy = spansYears();
    state.parcelas.forEach(function (p) {
      var st = statusParcela(p);
      var q = quemDeve(p.n), c = q.filter(function (x) { return isPago(x.id, p.n); }).length;
      var lbl = st === "done" ? "Quitada" : st === "late" ? "Atrasada" : "A vencer";
      h += '<div class="pcard s-' + st + '"><p class="pn">Parcela ' + p.n + "</p>"
        + '<p class="pd">' + br(p.vencimento, yy) + "</p>"
        + '<p class="pc">' + c + " de " + q.length + " &middot; " + money(recebidoParcela(p.n)) + " de " + money(somaParcela(p.n)) + "</p>"
        + '<span class="pill ' + st + '">' + lbl + "</span></div>";
    });
    h += "</div>";

    /* por pessoa */
    h += '<div class="sec-head"><h2>Parcelas por pessoa</h2><span class="sec-note">'
      + (canEdit ? "Toque numa parcela para dar baixa" : "Fale com o organizador para corrigir algo") + "</span></div>";
    h += '<div class="people">';
    state.pessoas.forEach(function (pe) {
      var minhas = state.parcelas.filter(function (p) { return aplica(pe, p.n); });
      var total = totalPessoa(pe), pagas = 0, pagoV = 0;
      minhas.forEach(function (p) { if (isPago(pe.id, p.n)) { pagas++; pagoV += valorDe(pe, p.n); } });
      h += '<article class="person"><div class="person-top">'
        + '<span class="person-name">' + esc(pe.nome) + "</span>"
        + '<span class="person-val"><b>' + money(pagoV) + "</b> de " + money(total) + "</span></div>"
        + '<div class="mini"><i style="width:' + (minhas.length ? Math.round((pagas / minhas.length) * 100) : 0) + '%"></i></div><div class="chips">';
      minhas.forEach(function (p) {
        var v = valorDe(pe, p.n), pago = isPago(pe.id, p.n);
        var atras = !pago && vencida(p.vencimento);
        var cls = "chip" + (pago ? " paid" : atras ? " late" : "");
        var mk = pago ? "&#10003;" : atras ? "!" : "";
        var ttl = pago ? "Parcela " + p.n + " (" + money(v) + ") paga em " + brFull(state.pagos[pe.id + ":" + p.n])
          : "Parcela " + p.n + " (" + money(v) + ") &middot; vence " + brFull(p.vencimento);
        var body = '<span class="cn">P' + p.n + '</span> ' + money(v) + (mk ? ' <span class="mk">' + mk + "</span>" : "");
        h += canEdit
          ? '<button type="button" class="' + cls + '" data-p="' + pe.id + '" data-n="' + p.n + '" aria-pressed="' + pago + '" title="' + ttl + '">' + body + "</button>"
          : '<span class="' + cls + '" title="' + ttl + '">' + body + "</span>";
      });
      h += "</div></article>";
    });
    h += "</div>";

    /* caução, empregada, van */
    ORDEM_FUNDOS.forEach(function (f) {
      h += '<div class="sec-head"><h2>' + FUNDOS[f].nome + '</h2><span class="sec-note">'
        + notaFundo(f)
        + (canEdit ? "<br>Digite o valor recebido e clique em + para somar ao total" : "") + "</span></div>";
      h += '<div class="cau">';
      pessoasFundo(f).forEach(function (pe) {
        h += cauRowHTML(f, pe);
      });
      h += '<div class="cau-foot" data-foot="' + f + '">' + cauFootHTML(f) + "</div></div>";
    });

    h += "</div></details>";

    /* ajustes */
    if (canEdit) {
      h += '<details class="cfg"><summary>Ajustes da casa, datas, valores e fotos</summary><div class="cfg-body">';
      h += '<div><p class="cfg-h">A casa</p><div class="cfg-grid">'
        + fld("Nome", "text", "casa.nome", state.casa.nome)
        + fld("Local", "text", "casa.local", state.casa.local)
        + fld("Check-in", "date", "casa.checkin", state.casa.checkin)
        + fld("Check-out", "date", "casa.checkout", state.casa.checkout)
        + "</div></div>";
      h += '<div><p class="cfg-h">Vencimentos</p><div class="cfg-grid">'
        + state.parcelas.map(function (p, i) { return fld("Parcela " + p.n, "date", "parcelas." + i + ".vencimento", p.vencimento); }).join("")
        + fld("Cau&ccedil;&atilde;o", "date", "caucao.vencimento", state.caucao.vencimento)
        + fld("Cau&ccedil;&atilde;o por pessoa", "number", "caucao.porPessoa", state.caucao.porPessoa)
        + fld("Empregada", "date", "empregada.vencimento", state.empregada.vencimento)
        + fld("Empregada por pessoa", "number", "empregada.porPessoa", state.empregada.porPessoa)
        + fld("Van por pessoa", "number", "van.porPessoa", state.van.porPessoa)
        + fld("Van entrada", "number", "van.entrada", state.van.entrada)
        + fld("Van restante vence", "date", "van.vencimento", state.van.vencimento)
        + "</div></div>";
      h += '<div><p class="cfg-h">Nome e valor de cada parcela</p><div class="cfg-grid cfg-pess">'
        + state.pessoas.map(function (pe, i) {
            return '<span class="fld"><label for="f-pessoas.' + i + '.nome">' + esc(pe.nome) + " &middot; " + money(totalPessoa(pe)) + "</label>"
              + '<input id="f-pessoas.' + i + '.nome" type="text" data-cfg="pessoas.' + i + '.nome" value="' + esc(pe.nome) + '" aria-label="Nome">'
              + '<span class="vals">' + state.parcelas.map(function (p) {
                  var v = valorDe(pe, p.n);
                  return '<input type="number" min="0" step="1" inputmode="decimal" placeholder="P' + p.n + '" data-cfg="pessoas.' + i + ".valores." + p.n + '" value="' + (v === null ? "" : esc(v)) + '" aria-label="' + esc(pe.nome) + " parcela " + p.n + '" title="Parcela ' + p.n + '">';
                }).join("") + "</span></span>";
          }).join("")
        + '</div><p class="cfg-sum">Cada caixa &eacute; uma parcela (P1 a P' + nParc() + '). Deixe vazia quando a parcela n&atilde;o vale para a pessoa. Total das ' + nParc() + " parcelas: " + money(alvoParcelas()) + "</p></div>";
      h += '<div><p class="cfg-h">Fotos da turma (at&eacute; 5)</p>'
        + (state.fotos.length
            ? '<div class="thumbs">' + state.fotos.map(function (f, i) {
                return '<span class="thumb"><img src="' + esc(f.src) + '" alt="Foto ' + (i + 1) + '">'
                  + '<button type="button" data-delfoto="' + i + '" aria-label="Remover foto ' + (i + 1) + '">&times;</button></span>';
              }).join("") + "</div>"
            : "")
        + '<label class="btn" for="foto-in">Adicionar foto</label>'
        + '<input id="foto-in" type="file" accept="image/*" multiple hidden>'
        + '<p class="cfg-sum">As fotos ficam guardadas dentro da pr&oacute;pria p&aacute;gina e s&atilde;o reduzidas automaticamente.</p></div>';
      h += '<div><p class="cfg-h">Backup dos lan&ccedil;amentos</p>'
        + '<button type="button" class="btn" id="copiar-dados">Copiar dados</button>'
        + '<p class="cfg-sum">Copia s&oacute; os n&uacute;meros (quem pagou o qu&ecirc;), sem as fotos. '
        + "Cole no chat quando pedir uma altera&ccedil;&atilde;o nesta p&aacute;gina, pra n&atilde;o perder nada.</p></div>";
      h += "</div></details>";
    }

    h += '<p class="foot" id="foot"><b id="stamp">' + stampHTML() + "</b><br>"
      + "Este controle &eacute; mantido pelo organizador da viagem. Se algum valor estiver errado, fale com ele &mdash; "
      + "a p&aacute;gina mostra a situa&ccedil;&atilde;o at&eacute; a data acima.</p>";

    document.getElementById("root").innerHTML = h;
  }

  function notaFundo(f) {
    var c = state[FUNDOS[f].cfg], pp = porPessoaFundo(f), ent = +c.entrada || 0;
    var t = money(pp) + " por pessoa";
    if (ent > 0) t += " (" + money(ent) + " de entrada + " + money(pp - ent) + " depois)";
    (c.extras || []).forEach(function (x) {
      var a = alvoPessoa(f, x), e = entradaPessoa(f, x);
      t += " &middot; " + esc(x.nome) + ": " + money(a) + (e > 0 ? " (" + money(e) + " + " + money(a - e) + ")" : "");
    });
    return t + (c.vencimento ? " &middot; vence " + brFull(c.vencimento) : ent > 0 ? "" : "");
  }
  function cauRowHTML(fu, pe) {
    var alvo = alvoPessoa(fu, pe);
    var pg = pagoFundo(fu, pe.id);
    var f = alvo > 0 ? Math.min(1, pg / alvo) : 0;
    var s = cauStatus(fu, pg, alvo, entradaPessoa(fu, pe));
    var lancs = lancsDe(fu, pe.id);
    var k = chaveFundo(fu, pe.id), nome = FUNDOS[fu].nome;

    var chips = "";
    if (lancs.length) {
      chips = '<span class="cau-lancs">' + lancs.map(function (l, i) {
        var t = l.d ? "Lan&ccedil;ado em " + brFull(l.d) : "Lan&ccedil;amento";
        return canEdit
          ? '<button type="button" class="lanc" data-dellanc="' + k + "|" + i + '" title="' + t + ' &mdash; clique para remover">'
              + money(l.v) + ' <span class="x">&times;</span></button>'
          : '<span class="lanc" title="' + t + '">' + money(l.v) + "</span>";
      }).join("") + "</span>";
    }

    return '<div class="cau-row' + (chips ? " has-lancs" : "") + '" data-row="' + k + '">'
      + '<span class="cau-name">' + esc(pe.nome) + "</span>"
      + '<span class="cau-tot"><b>' + money(pg) + '</b> <span class="of">de ' + money(alvo) + "</span></span>"
      + (canEdit
          ? '<span class="cau-add"><span class="cur">R$</span>'
            + '<input type="number" inputmode="decimal" min="0" step="10" placeholder="0" data-add="' + k + '"'
            + ' aria-label="Valor a somar em ' + nome + " de " + esc(pe.nome) + '">'
            + '<button type="button" class="plus" data-addbtn="' + k + '" aria-label="Somar em ' + nome + " de " + esc(pe.nome) + '">+</button></span>'
          : "")
      + '<span class="cau-bar' + (f >= 1 ? " full" : "") + '"><i style="width:' + Math.round(f * 100) + '%"></i></span>'
      + '<span class="cau-st"><span class="pill ' + s.cls + '">' + s.lbl + "</span></span>"
      + chips + "</div>";
  }

  function cauFootHTML(f) {
    var a = alvoFundo(f), r = recebidoFundo(f);
    var grupos = {}, ordem = [];
    pessoasFundo(f).forEach(function (p) {
      var v = alvoPessoa(f, p);
      if (!grupos[v]) { grupos[v] = 0; ordem.push(v); }
      grupos[v]++;
    });
    var conta = ordem.map(function (v) { return grupos[v] + " x " + money(v); }).join(" + ");
    return "<span>Alvo: <b>" + money(a) + "</b> (" + conta + ")</span>"
      + "<span>Recebido: <b>" + money(r) + "</b> &middot; falta <b>" + money(Math.max(0, a - r)) + "</b></span>";
  }

  function repintarFundo(f, pid) {
    var row = document.querySelector('[data-row="' + chaveFundo(f, pid) + '"]');
    if (!row) return;
    var pe = null;
    var lista = pessoasFundo(f);
    for (var i = 0; i < lista.length; i++) if (lista[i].id === pid) pe = lista[i];
    if (!pe) return;
    row.outerHTML = cauRowHTML(f, pe);
    var ft = document.querySelector('[data-foot="' + f + '"]');
    if (ft) ft.innerHTML = cauFootHTML(f);
    syncHero();
  }

  function somarFundo(k) {
    var c = lerChave(k), f = c.f, pid = c.pid, lanc = state[FUNDOS[f].lanc];
    var inp = document.querySelector('[data-add="' + k + '"]');
    if (!inp) return;
    var v = parseFloat(String(inp.value).replace(",", "."));
    if (!isFinite(v) || v === 0) { toast("Digite um valor antes de somar."); inp.focus(); return; }
    if (!lanc[pid]) lanc[pid] = [];
    lanc[pid].push({ v: v, d: today() });
    repintarFundo(f, pid);
    var novo = document.querySelector('[data-add="' + k + '"]');
    if (novo) novo.focus();
    toast((v > 0 ? "Somado " : "Descontado ") + money(Math.abs(v)) + " (" + FUNDOS[f].txt + ") — total: " + money(pagoFundo(f, pid)));
    save();
  }

  function removerLanc(k, i) {
    var c = lerChave(k), f = c.f, pid = c.pid, lanc = state[FUNDOS[f].lanc];
    var l = lanc[pid];
    if (!l || !l[i]) return;
    l.splice(i, 1);
    if (!l.length) delete lanc[pid];
    repintarFundo(f, pid);
    toast("Lançamento removido (" + FUNDOS[f].txt + ") — total: " + money(pagoFundo(f, pid)));
    save();
  }

  function stampHTML() {
    if (!state.atualizadoEm) return "Ainda sem lan&ccedil;amentos.";
    var d = new Date(state.atualizadoEm);
    if (isNaN(d.getTime())) return "Ainda sem lan&ccedil;amentos.";
    function z(n) { return (n < 10 ? "0" : "") + n; }
    return "Atualizado em " + z(d.getDate()) + "/" + z(d.getMonth() + 1) + "/" + d.getFullYear()
      + " &agrave;s " + z(d.getHours()) + "h" + z(d.getMinutes()) + ".";
  }
  function stamp() {
    state.atualizadoEm = new Date().toISOString();
    var el = document.getElementById("stamp");
    if (el) el.innerHTML = stampHTML();
  }

  function cauStatus(f, pg, alvo, ent) {
    if (pg >= alvo && alvo > 0) return { cls: "done", lbl: "Quitado" };
    if (ent > 0 && pg >= ent) return { cls: "part", lbl: "Entrada paga" };
    if (vencida(state[FUNDOS[f].cfg].vencimento)) return { cls: "late", lbl: pg > 0 ? "Parcial, atrasado" : "Atrasado" };
    if (pg > 0) return { cls: "part", lbl: "Parcial" };
    return { cls: "open", lbl: "Em aberto" };
  }

  function fld(label, type, path, val) {
    return '<span class="fld"><label for="f-' + path + '">' + label + "</label>"
      + '<input id="f-' + path + '" type="' + type + '" data-cfg="' + path + '" value="' + esc(val == null ? "" : val) + '"'
      + (type === "number" ? ' min="0" step="10" inputmode="decimal"' : "") + "></span>";
  }
  function setPath(path, val) {
    var parts = path.split("."), o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
  }
  function syncHero() {
    var el = document.getElementById("hero");
    if (el) el.innerHTML = heroHTML();
    var rs = document.getElementById("resumo");
    if (rs) rs.innerHTML = resumoHTML();
  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  /* Acha o próprio CSS/JS mesmo que a etiqueta id tenha se perdido pelo caminho:
     cai para o maior <style> / maior <script> inline da página. */
  function acharCSS() {
    var el = document.getElementById("app-css");
    if (el && el.textContent) return el.textContent;
    var todos = document.getElementsByTagName("style"), melhor = null;
    for (var i = 0; i < todos.length; i++) {
      if (!melhor || todos[i].textContent.length > melhor.textContent.length) melhor = todos[i];
    }
    return melhor && melhor.textContent.length > 500 ? melhor.textContent : null;
  }
  function acharJS() {
    var el = document.getElementById("app-js");
    if (el && el.textContent) return el.textContent;
    var todos = document.getElementsByTagName("script"), melhor = null;
    for (var i = 0; i < todos.length; i++) {
      var s = todos[i];
      if (s.src || (s.type && s.type.indexOf("json") >= 0)) continue;
      if (!melhor || s.textContent.length > melhor.textContent.length) melhor = s;
    }
    return melhor && melhor.textContent.length > 500 ? melhor.textContent : null;
  }

  function buildDoc() {
    var css = acharCSS();
    var js = acharJS();
    if (!css || !js) {
      throw new Error("A página carregou incompleta (faltou "
        + (!css ? "o estilo" : "o script")
        + "). Recarregue segurando Shift e tente de novo.");
    }
    var json = JSON.stringify(state, null, 2).replace(/</g, "\\u003c");
    var S = "scr" + "ipt";
    return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + "<title>Rateio da Casa</title>\n" + FONTS + '\n<style id="app-css">' + css + "</style>\n</head>\n<body>\n"
      + "<" + S + ' type="application/json" id="app-state">\n' + json + "\n</" + S + ">\n"
      + '<div id="root"></div>\n'
      + '<div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"></div>\n'
      + '<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto em tamanho grande"></div>\n'
      + '<div id="toast" role="status" aria-live="polite"></div>\n'
      + "<" + S + ' id="app-js">' + js + "</" + S + ">\n</body>\n</html>";
  }

  function buildStatic() {
    var t = esc(state.casa.nome), dts = state.casa.checkin ? brFull(state.casa.checkin) + " a " + brFull(state.casa.checkout) : "";
    var d = esc("Rateio da turma" + (dts ? " · " + dts : "") + ". Veja quanto falta pra cada um: parcelas, caução, empregada e van.");
    var icone = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#4A6885"/><path d="M14 33 32 17l18 16v17H39V38H25v12H14z" fill="#FAF9F6"/></svg>');
    return buildDoc().replace(
      '<meta name="viewport"',
      '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
        + '<meta http-equiv="Pragma" content="no-cache">\n'
        + '<meta http-equiv="Expires" content="0">\n'
        + '<meta name="robots" content="noindex, nofollow">\n'
        + '<meta name="description" content="' + d + '">\n'
        + '<meta property="og:type" content="website">\n'
        + '<meta property="og:url" content="' + SITE_URL + '">\n'
        + '<meta property="og:title" content="' + t + '">\n'
        + '<meta property="og:description" content="' + d + '">\n'
        + '<meta property="og:image" content="' + SITE_URL + 'og.jpg">\n'
        + '<meta property="og:image:width" content="1200">\n'
        + '<meta property="og:image:height" content="630">\n'
        + '<meta name="twitter:card" content="summary_large_image">\n'
        + '<meta name="theme-color" content="#4A6885">\n'
        + '<link rel="icon" href="' + icone + '">\n'
        + '<meta name="viewport"'
    ).replace("<title>Rateio da Casa</title>", "<title>" + t + " · Rateio</title>");
  }

  var htmlAtual = "", tipoAtual = "html";

  /* ---------- foto em tela cheia ---------- */
  var fotoAberta = -1;

  function garantirLightbox() {
    var lb = document.getElementById("lightbox");
    if (!lb) {
      lb = document.createElement("div");
      lb.id = "lightbox";
      lb.setAttribute("role", "dialog");
      lb.setAttribute("aria-modal", "true");
      lb.setAttribute("aria-label", "Foto em tamanho grande");
      document.body.appendChild(lb);
    }
    return lb;
  }

  function abrirFoto(i) {
    if (!state.fotos.length) return;
    fotoAberta = ((i % state.fotos.length) + state.fotos.length) % state.fotos.length;
    var f = state.fotos[fotoAberta];
    var varias = state.fotos.length > 1;
    var lb = garantirLightbox();
    lb.innerHTML = '<div class="veil2" data-fechafoto></div>'
      + '<button type="button" class="lb-btn lb-close" data-fechafoto aria-label="Fechar">&times;</button>'
      + (varias ? '<button type="button" class="lb-btn lb-prev" data-navfoto="-1" aria-label="Foto anterior">&#8249;</button>' : "")
      + (varias ? '<button type="button" class="lb-btn lb-next" data-navfoto="1" aria-label="Pr&oacute;xima foto">&#8250;</button>' : "")
      + '<img src="' + esc(f.src) + '" alt="Foto ' + (fotoAberta + 1) + ' da turma">'
      + (varias ? '<span class="lb-conta">' + (fotoAberta + 1) + " / " + state.fotos.length + "</span>" : "");
    lb.classList.add("on");
    var c = lb.querySelector(".lb-close");
    if (c) c.focus();
  }

  function fecharFoto() {
    var lb = document.getElementById("lightbox");
    if (!lb) return;
    lb.classList.remove("on");
    lb.innerHTML = "";
    fotoAberta = -1;
  }

  function garantirModal() {
    var m = document.getElementById("modal");
    if (!m) {
      m = document.createElement("div");
      m.id = "modal";
      m.setAttribute("role", "dialog");
      m.setAttribute("aria-modal", "true");
      document.body.appendChild(m);
    }
    return m;
  }

  function abrirModal(tipo) {
    var m = garantirModal();
    tipoAtual = tipo === "dados" ? "dados" : "html";
    try {
      stamp();
      htmlAtual = tipoAtual === "dados" ? dadosJSON() : buildStatic();
    } catch (err) {
      m.innerHTML = '<div class="veil" data-fechar></div><div class="modal-box">'
        + '<button type="button" class="modal-close" data-fechar aria-label="Fechar">&times;</button>'
        + '<h3 id="m-title">Deu erro ao gerar</h3>'
        + '<p class="modal-hint alerta">' + esc(String((err && err.message) || err))
        + "</p><p>Tente recarregar a p&aacute;gina segurando Shift (ou Ctrl+Shift+R). "
        + "Se continuar, copie a mensagem acima e mande no chat.</p></div>";
      m.classList.add("on");
      return;
    }

    var ehDados = tipoAtual === "dados";
    m.innerHTML = '<div class="veil" data-fechar></div><div class="modal-box">'
      + '<button type="button" class="modal-close" data-fechar aria-label="Fechar">&times;</button>'
      + '<h3 id="m-title">' + (ehDados ? "Copiar dados" : "Atualizar o grupo") + "</h3>"
      + (ehDados
          ? "<p>S&atilde;o s&oacute; os n&uacute;meros &mdash; quem pagou o qu&ecirc; &mdash; sem as fotos. "
            + "Copie e cole no chat antes de pedir qualquer altera&ccedil;&atilde;o na p&aacute;gina.</p>"
          : "<p>Esta &eacute; a vers&atilde;o de leitura com os valores de agora, pronta pro GitHub.</p>")
      + '<div class="modal-actions">'
      + '<button type="button" class="btn btn-key" id="m-copiar">Copiar</button>'
      + (dl && !ehDados ? '<button type="button" class="btn" id="m-baixar">Baixar o arquivo</button>' : "")
      + "</div>"
      + (ehDados ? ""
          : "<ol><li>No seu reposit&oacute;rio, clique no arquivo <b>index.html</b>.</li>"
            + "<li>Clique no <b>&iacute;cone de l&aacute;pis</b> (Edit this file), no canto superior direito.</li>"
            + "<li>Selecione tudo (Ctrl+A) e cole por cima (Ctrl+V).</li>"
            + "<li>Desça a p&aacute;gina e clique em <b>Commit changes</b>. Espere um minuto.</li></ol>")
      + '<textarea id="m-code" readonly spellcheck="false" aria-label="Conte&uacute;do para copiar"></textarea>'
      + '<p class="modal-hint" id="m-hint">O texto da caixa acima j&aacute; est&aacute; selecionado. Se o bot&atilde;o falhar, '
      + "aperte Ctrl+C (ou Cmd+C) que funciona do mesmo jeito.</p></div>";

    var ta = m.querySelector("#m-code");
    if (ta) ta.value = htmlAtual;
    m.classList.add("on");
    selecionarCodigo();
  }

  function fecharModal() {
    var m = document.getElementById("modal");
    m.classList.remove("on");
    m.innerHTML = "";
    htmlAtual = "";
  }

  function dadosJSON() {
    return JSON.stringify({
      casa: state.casa, parcelas: state.parcelas, caucao: state.caucao,
      empregada: state.empregada,
      pessoas: state.pessoas, pagos: state.pagos, caucaoLanc: state.caucaoLanc,
      empregadaLanc: state.empregadaLanc,
      van: state.van, vanLanc: state.vanLanc,
      atualizadoEm: state.atualizadoEm
    }, null, 1);
  }

  function selecionarCodigo() {
    var ta = document.getElementById("m-code");
    if (!ta) return null;
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    return ta;
  }

  function copiar() {
    var ta = selecionarCodigo();
    if (!ta) return;
    var btn = document.getElementById("m-copiar");
    function ok() {
      toast("Código copiado — agora cole no GitHub");
      if (btn) { btn.textContent = "Copiado ✓"; setTimeout(function () { btn.textContent = "Copiar o código"; }, 2500); }
    }
    function falhou() {
      selecionarCodigo();
      var mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
      toast("O texto já está selecionado — aperte " + (mac ? "Cmd+C" : "Ctrl+C") + " agora.");
      var hint = document.getElementById("m-hint");
      if (hint) {
        hint.innerHTML = "<b>O navegador bloqueou a cópia automática.</b> O texto da caixa já está todo selecionado — "
          + "aperte <b>" + (mac ? "Cmd+C" : "Ctrl+C") + "</b> agora para copiar.";
        hint.classList.add("alerta");
      }
    }
    try { if (document.execCommand("copy")) { ok(); return; } } catch (e) {}
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(htmlAtual).then(ok)["catch"](falhou);
    } else falhou();
  }

  function baixar() {
    if (!dl) return;
    dl.save({ filename: "index.html", data: htmlAtual }).then(function () {
      toast("Arquivo baixado — suba no GitHub por Add file → Upload files");
    })["catch"](function (err) {
      var code = err && err.code;
      if (code === "declined") return;
      if (code === "extension_not_enabled" || code === "rejected_extension") {
        dl.save({ filename: "index.html.txt", data: htmlAtual }).then(function () {
          toast('Baixado como .txt — renomeie para "index.html" antes de subir');
        })["catch"](function () { toast("Não deu pra baixar. Use o botão de copiar."); });
        return;
      }
      if (code === "too_large") { toast("Página grande demais pra baixar — use o botão de copiar."); return; }
      if (code === "rate_limited") { toast("Espere um instante e clique de novo."); return; }
      toast("Não deu pra baixar. Use o botão de copiar.");
    });
  }

  function save() {
    if (!api) return;
    clearTimeout(pending);
    pending = setTimeout(function () {
      stamp();
      api.publish(buildDoc()).then(function () { toast("Salvo"); })["catch"](function (err) {
        var code = err && err.code;
        if (code === "conflict") toast("Alguém salvou antes — recarregando com a versão mais recente");
        else if (code === "not_granted" || code === "not_writer") { canEdit = false; render(); toast("Este link é somente leitura"); }
        else toast("Não consegui salvar. Tente de novo.");
      });
    }, 900);
  }

  /* ---------- fotos ---------- */
  function shrink(file, cb) {
    var r = new FileReader();
    r.onerror = function () { cb(null); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { cb(null); };
      img.onload = function () {
        var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * s));
        c.height = Math.max(1, Math.round(img.height * s));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try { cb(c.toDataURL("image/jpeg", 0.66)); } catch (e) { cb(null); }
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    /* a foto em tela cheia funciona pra todo mundo, inclusive quem só visualiza */
    if (e.target.closest("[data-fechafoto]")) { fecharFoto(); return; }
    var nav = e.target.closest("[data-navfoto]");
    if (nav) { abrirFoto(fotoAberta + (+nav.dataset.navfoto)); return; }
    var fb = e.target.closest("[data-foto]");
    if (fb) { abrirFoto(+fb.dataset.foto); return; }
    if (e.target.closest("[data-fechar]")) { fecharModal(); return; }
    if (e.target.closest("#m-copiar")) { copiar(); return; }
    if (e.target.closest("#m-baixar")) { baixar(); return; }
    if (!canEdit) return;
    if (e.target.closest("#exportar")) { abrirModal("html"); return; }
    if (e.target.closest("#copiar-dados")) { abrirModal("dados"); return; }
    var add = e.target.closest("[data-addbtn]");
    if (add) { somarFundo(add.dataset.addbtn); return; }
    var rem = e.target.closest("[data-dellanc]");
    if (rem) { var p = rem.dataset.dellanc.split("|"); removerLanc(p[0], +p[1]); return; }
    var del = e.target.closest("[data-delfoto]");
    if (del) {
      state.fotos.splice(+del.dataset.delfoto, 1);
      var wasOpen = true; render();
      var d = document.querySelector("details.cfg"); if (d && wasOpen) d.open = true;
      save(); return;
    }
    var b = e.target.closest("button.chip");
    if (!b) return;
    var key = b.dataset.p + ":" + b.dataset.n;
    if (Object.prototype.hasOwnProperty.call(state.pagos, key)) delete state.pagos[key];
    else state.pagos[key] = today();
    render(); save();
  });

  document.addEventListener("change", function (e) {
    if (!canEdit) return;
    var t = e.target;
    if (t.id === "foto-in" && t.files && t.files.length) {
      var files = [].slice.call(t.files, 0, Math.max(0, MAX_FOTOS - state.fotos.length));
      if (!files.length) { toast("Já são " + MAX_FOTOS + " fotos — remova uma antes"); t.value = ""; return; }
      var left = files.length;
      toast(files.length > 1 ? "Preparando " + files.length + " fotos…" : "Preparando a foto…");
      files.forEach(function (f) {
        shrink(f, function (src) {
          if (src) state.fotos.push({ src: src, legenda: "" });
          if (--left === 0) {
            render();
            var d = document.querySelector("details.cfg"); if (d) d.open = true;
            save();
          }
        });
      });
      t.value = "";
      return;
    }
    if (t.dataset && t.dataset.cfg) {
      var v = t.type === "number" ? Math.max(0, parseFloat(String(t.value).replace(",", ".")) || 0) : t.value;
      var mv = /^pessoas\.(\d+)\.valores\.(\d+)$/.exec(t.dataset.cfg);
      if (mv) {
        var pv = state.pessoas[+mv[1]];
        if (!pv.valores) { pv.valores = {}; state.parcelas.forEach(function (p) { pv.valores[p.n] = +pv.parcela || 0; }); }
        if (String(t.value).trim() === "") delete pv.valores[mv[2]]; else pv.valores[mv[2]] = v;
      } else setPath(t.dataset.cfg, v);
      var d2 = document.querySelector("details.cfg");
      var open = d2 && d2.open;
      render();
      var d3 = document.querySelector("details.cfg");
      if (d3 && open) d3.open = true;
      save();
    }
  });

  document.addEventListener("keydown", function (e) {
    var lb = document.getElementById("lightbox");
    var fotoAberta_ = lb && lb.classList.contains("on");
    if (fotoAberta_) {
      if (e.key === "Escape") { e.preventDefault(); fecharFoto(); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); abrirFoto(fotoAberta + 1); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); abrirFoto(fotoAberta - 1); return; }
    }
    if (e.key === "Escape") {
      var m = document.getElementById("modal");
      if (m && m.classList.contains("on")) fecharModal();
      return;
    }
    if (e.key === "Enter" && canEdit && e.target && e.target.dataset && e.target.dataset.add) {
      e.preventDefault();
      somarFundo(e.target.dataset.add);
    }
  });

  /* qualquer erro não tratado vira aviso visível, pra não falhar em silêncio */
  var jaAvisou = false;
  window.addEventListener("error", function (ev) {
    if (jaAvisou) return;
    jaAvisou = true;
    setTimeout(function () { jaAvisou = false; }, 6000);
    toast("Erro: " + ((ev && ev.message) || "algo quebrou") + " — recarregue segurando Shift.");
  });

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      if (!a) return;
      api = a; canEdit = true; render();
    })["catch"](function () {});
    window.claude.use("downloads").then(function (d) {
      if (!d) return;
      dl = d;
      if (canEdit) render();
    })["catch"](function () {});
  }
})();
</script>
</body>
</html>
